<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialNetwork - Лента</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1><a href="index.html">SocialNetwork</a></h1>
    <div class="nav-links">
      <a href="auth.html" id="authNavBtn"><button>Войти</button></a>
      <div id="userHeader" class="user-profile-badge hidden" style="display:flex; align-items:center; gap:10px;">
        <a href="profile.html"><img id="myAvatar" class="avatar" src=""></a>
        <a href="profile.html" id="myDisplayName" style="font-weight:600; text-decoration:none; color:inherit;"></a>
        <button id="logoutBtn" class="btn-secondary">Выйти</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Поиск по постам...">
    </div>

    <div id="postCreateSection" class="card hidden">
      <textarea id="postInput" placeholder="Что нового?"></textarea>
      <input type="text" id="postImgInput" placeholder="URL-ссылка на картинку (необязательно)">
      <button id="publishBtn">Опубликовать</button>
    </div>

    <div id="postsFeed"></div>
  </div>

  <script type="module">
    import { auth, db, renderFeed } from './app.js';
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    renderFeed();

    document.getElementById('searchInput').oninput = (e) => {
      renderFeed(null, e.target.value);
    };

    document.getElementById('publishBtn').onclick = async () => {
      const text = document.getElementById('postInput').value.trim();
      const img = document.getElementById('postImgInput').value.trim();
      if (!text) return alert('Введите текст поста');

      await addDoc(collection(db, "posts"), {
        text: text,
        imageUrl: img || null,
        authorName: auth.currentUser.displayName || auth.currentUser.email,
        authorAvatar: auth.currentUser.photoURL || 'https://via.placeholder.com/40',
        authorId: auth.currentUser.uid,
        createdAt: new Date(),
        likes: []
      });

      document.getElementById('postInput').value = '';
      document.getElementById('postImgInput').value = '';
    };
  </script>
</body>
</html>
