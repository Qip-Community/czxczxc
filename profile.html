<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль - SocialNetwork</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1><a href="index.html">SocialNetwork</a></h1>
    <a href="index.html"><button class="btn-secondary">На главную</button></a>
  </header>

  <div class="container">
    <div class="card" style="text-align: center;">
      <img id="profAvatar" class="avatar" style="width: 100px; height: 100px; margin-bottom: 10px;" src="">
      <h2 id="profName"></h2>
      
      <div id="editProfileSection" class="hidden" style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
        <h3>Редактировать профиль</h3>
        <input type="text" id="editName" placeholder="Новое имя">
        <input type="text" id="editAvatar" placeholder="URL нового аватара">
        <button id="saveProfileBtn">Сохранить изменения</button>
      </div>
    </div>

    <h3>Посты пользователя:</h3>
    <div id="postsFeed" style="margin-top: 15px;"></div>
  </div>

  <script type="module">
    import { auth, renderFeed } from './app.js';
    import { onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const urlParams = new URLSearchParams(window.location.search);
    const targetUid = urlParams.get('uid');

    onAuthStateChanged(auth, (user) => {
      const uidToLoad = targetUid || user?.uid;

      if (!uidToLoad) {
        window.location.href = 'auth.html';
        return;
      }

      if (user && uidToLoad === user.uid) {
        document.getElementById('profName').textContent = user.displayName || user.email;
        document.getElementById('profAvatar').src = user.photoURL || 'https://via.placeholder.com/40';
        document.getElementById('editProfileSection').classList.remove('hidden');

        document.getElementById('saveProfileBtn').onclick = async () => {
          const newName = document.getElementById('editName').value.trim();
          const newAvatar = document.getElementById('editAvatar').value.trim();

          await updateProfile(user, {
            displayName: newName || user.displayName,
            photoURL: newAvatar || user.photoURL
          });

          location.reload();
        };
      }

      renderFeed(uidToLoad);
    });
  </script>
</body>
</html>
